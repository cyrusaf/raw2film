[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raw2film"
version = "0.1.0"
description = "Minimal color-managed RAW-to-film-look developer with LUT export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=10", "PyYAML>=6", "rawpy>=0.20"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
raw2film = "raw2film.cli:main"

[tool.setuptools.packages.find]
include = ["raw2film*"]

[tool.setuptools.package-data]
raw2film = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
